plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    namespace 'com.lifetracker.mobile'
    compileSdk = 36
    defaultConfig {
        applicationId "com.lifetracker.mobile"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    buildTypes {
        debug {
            buildConfigField("String", "BASE_URL", "\"${localProps.getProperty('dev.base_url', 'http://10.0.2.2:5000/')}\"")
        }
        release {
            buildConfigField("String", "BASE_URL", "\"http://10.0.2.2:5000/\"")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes.add('/META-INF/{AL2.0,LGPL2.1}')
            excludes.add('/META-INF/versions/**')
            excludes.add('/META-INF/OSGI-INF/**')
            excludes.add('META-INF/MANIFEST.MF')
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.03.00')

    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0")
    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.10.0")

    implementation 'com.jakewharton.timber:timber:5.0.1'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-text-google-fonts'

    implementation 'androidx.navigation:navigation-compose:2.9.7'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'

    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.7.1")

    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    implementation 'androidx.compose.foundation:foundation-layout:1.10.5'
    ksp 'androidx.room:room-compiler:2.8.4'

    implementation("com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0")

    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0")

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'


    implementation("io.insert-koin:koin-android:4.1.1")
    implementation("io.insert-koin:koin-androidx-compose:4.1.1")
    implementation("io.insert-koin:koin-androidx-workmanager:4.1.1")
    implementation("androidx.work:work-runtime-ktx:2.11.1")

    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'io.mockk:mockk:1.14.9'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    testImplementation 'io.insert-koin:koin-test:4.1.1'
    testImplementation 'io.insert-koin:koin-test-junit4:4.1.1'

    androidTestImplementation 'androidx.room:room-testing:2.8.4'
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.03.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}